# HorizontalPodAutoscaler para auto-escalado
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aurea-api-hpa
  namespace: aurea
  labels:
    app.kubernetes.io/name: aurea-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aurea-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aurea-frontend-hpa
  namespace: aurea
  labels:
    app.kubernetes.io/name: aurea-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aurea-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# PodDisruptionBudget para alta disponibilidad
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aurea-api-pdb
  namespace: aurea
  labels:
    app.kubernetes.io/name: aurea-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aurea-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aurea-frontend-pdb
  namespace: aurea
  labels:
    app.kubernetes.io/name: aurea-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aurea-frontend
