# NOTA: Este archivo es un template. En producción, los secrets deben
# ser gestionados por el equipo de AEAD usando:
# - HashiCorp Vault
# - Kubernetes External Secrets
# - SealedSecrets
# 
# NO commitear valores reales de producción a git.
apiVersion: v1
kind: Secret
metadata:
  name: aurea-secrets
  namespace: aurea
  labels:
    app.kubernetes.io/name: aurea-api
type: Opaque
stringData:
  # Base de datos PostgreSQL
  DATABASE_URL: "postgresql://aurea:CHANGE_ME@postgres-service:5432/aurea?schema=public"
  
  # JWT y sesiones
  JWT_SECRET: "CHANGE_ME_TO_SECURE_RANDOM_STRING_MIN_32_CHARS"
  COOKIE_SECRET: "CHANGE_ME_TO_SECURE_RANDOM_STRING_MIN_32_CHARS"
  
  # OIDC Client (proporcionado por AEAD)
  OIDC_CLIENT_ID: "CHANGE_ME_AEAD_PROVIDED"
  OIDC_CLIENT_SECRET: "CHANGE_ME_AEAD_PROVIDED"
  
  # Redis (si requiere auth)
  REDIS_PASSWORD: ""
  
  # OpenAI/Anthropic API Keys (para funciones AI)
  OPENAI_API_KEY: "CHANGE_ME_IF_USING_OPENAI"
  ANTHROPIC_API_KEY: "CHANGE_ME_IF_USING_ANTHROPIC"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: aurea
  labels:
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  POSTGRES_USER: "aurea"
  POSTGRES_PASSWORD: "CHANGE_ME_SECURE_DB_PASSWORD"
  POSTGRES_DB: "aurea"
