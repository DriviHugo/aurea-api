services:
  redis:
    image: redis:7.4-alpine
    ports:
      - 6379
    volumes:
      - redis_data:/data
    networks:
      - net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME:
      MONGO_INITDB_ROOT_PASSWORD:
      MONGO_INITDB_DATABASE: test-ai-hub
    ports:
      - 27017
    volumes:
      - mongodb_data:/data/db
    networks:
      - net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test-boilerplate-api
    ports:
      - 5432
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  postgresql_data:
    driver: local

networks:
  net:
    driver: bridge
