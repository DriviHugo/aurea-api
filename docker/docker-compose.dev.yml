name: aurea-api

services:
  redis:
    image: redis:7.4-alpine
    ports:
      - 35302:6379
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myproject
    ports:
      - "54320:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dbgate:
    image: dbgate/dbgate
    restart: unless-stopped
    environment:
      CONNECTIONS: con1,con3
      LABEL_con1: Postgres
      SERVER_con1: postgres
      USER_con1: postgres
      PASSWORD_con1: postgres
      PORT_con1: 5432
      ENGINE_con1: postgres@dbgate-plugin-postgres

      LABEL_con3: Redis
      SERVER_con3: redis
      PORT_con3: 6379
      ENGINE_con3: redis@dbgate-plugin-redis

    volumes:
      - dbgate-data:/root/.dbgate
    ports:
      - "55401:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  mailpit:
    image: "axllent/mailpit:latest"
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    networks:
      - net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO - S3-compatible object storage (replacement for Supabase Storage)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API endpoint
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

volumes:
  dbgate-data:
  minio-data:
  postgres_data:
  redis-data:

networks:
  net:
    driver: bridge
